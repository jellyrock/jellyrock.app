name: Feature request
description: Suggest something new for the jellyrock.app website
labels:
  - new-feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. A clear problem and a proposed solution help most; everything else is optional. To improve something the website already has, use the Enhancement request form instead. For the Roku app, use the JellyRock app's issue tracker.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What can't visitors find or do on the website today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the website have or do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Other approaches you thought about, and why you prefer this one.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context (optional)
      description: Links, screenshots or anything else that illustrates the idea.
    validations:
      required: false
