name: Deploy Homepage

on:
  push:
    branches: [main]
  # Fired by the upstream jellyrock repo when content the site renders at
  # build time changes (currently docs/screenshots; see issue #1). Those
  # assets are gitignored and pulled fresh on every build, so a rebuild is
  # all that's needed to pick them up.
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:

concurrency:
  group: deploy-homepage
  # Never stop a deploy halfway through rsync. A newer push waits, then deploys.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same checks, build and browser tests a pull request runs (ci.yml). Upstream
  # content-update rebuilds never get a PR, so this is their only gate.
  gates:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deploy exactly the build the gates tested, not a fresh rebuild.
      - name: Download tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write SSH key via printf (avoids echo's newline/escape issues)
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Use pre-verified host key from secret (avoids ssh-keyscan MITM risk)
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            dist/ \
            "${VPS_USER}@${VPS_HOST}:/opt/jellyrock/homepage/"

      - name: Verify the live site serves this build
        run: scripts/verify-live.sh https://jellyrock.app

  # Deploy heartbeat (ADR-0005). Its own job so a failure in the gates alerts too, not
  # only a failed rsync. Values passed via env, never inlined into the script, to avoid
  # commit-message shell injection. No-op until the GOTIFY_URL secret is set.
  notify:
    needs: [gates, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Gotify
        env:
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          REPO: ${{ github.event.repository.name }}
          GATES: ${{ needs.gates.result }}
          DEPLOY: ${{ needs.deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.client_payload.reason || 'manual / upstream trigger' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$GOTIFY_URL" ] && { echo "GOTIFY_URL unset — skipping"; exit 0; }
          if [ "$GATES" = success ] && [ "$DEPLOY" = success ]; then
            title="${REPO} deploy ok"; priority=3; detail="Deployed and verified live."
          elif [ "$GATES" = cancelled ] || [ "$DEPLOY" = cancelled ]; then
            title="${REPO} deploy cancelled"; priority=5; detail="Run was cancelled."
          elif [ "$GATES" != success ]; then
            title="${REPO} deploy FAILED"; priority=8; detail="Checks or browser tests failed; nothing was deployed."
          else
            title="${REPO} deploy FAILED"; priority=8; detail="Tests passed but rsync or the live check failed."
          fi
          curl -fsS -m 10 "$GOTIFY_URL" \
            -F "priority=${priority}" \
            -F "title=${title}" \
            -F "message=${detail}
          Commit: ${COMMIT_MSG}
          Run: ${RUN_URL}" || true
