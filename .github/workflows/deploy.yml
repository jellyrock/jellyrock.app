name: Deploy Homepage

on:
  push:
    branches: [main]
  # Fired by the upstream jellyrock repo when content the site renders at
  # build time changes (currently docs/screenshots; see issue #1). Those
  # assets are gitignored and pulled fresh on every build, so a rebuild is
  # all that's needed to pick them up.
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:

concurrency:
  group: deploy-homepage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks (astro + eslint + prettier)
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write SSH key via printf (avoids echo's newline/escape issues)
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Use pre-verified host key from secret (avoids ssh-keyscan MITM risk)
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            dist/ \
            "${VPS_USER}@${VPS_HOST}:/opt/jellyrock/homepage/"

      # Deploy heartbeat (ADR-0005). Values passed via env, never inlined into
      # the script, to avoid commit-message shell injection. No-op until the
      # GOTIFY_URL secret is set.
      - name: Notify Gotify on success
        if: success()
        env:
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          REPO: ${{ github.event.repository.name }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.client_payload.reason || 'manual / upstream trigger' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$GOTIFY_URL" ] && { echo "GOTIFY_URL unset — skipping"; exit 0; }
          curl -fsS -m 10 "$GOTIFY_URL" \
            -F "priority=3" \
            -F "title=${REPO} deploy ok" \
            -F "message=Commit: ${COMMIT_MSG}
          Run: ${RUN_URL}" || true

      - name: Notify Gotify on failure
        if: failure()
        env:
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          REPO: ${{ github.event.repository.name }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.client_payload.reason || 'manual / upstream trigger' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$GOTIFY_URL" ] && exit 0
          curl -fsS -m 10 "$GOTIFY_URL" \
            -F "priority=8" \
            -F "title=${REPO} deploy FAILED" \
            -F "message=Commit: ${COMMIT_MSG}
          Run: ${RUN_URL}" || true
