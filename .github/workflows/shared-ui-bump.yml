name: shared-ui bump

# Opens the PR that moves this site to a new shared-ui release, with screenshot baselines
# regenerated against it, and auto-merges it when those screenshots match the ones approved on
# the shared-ui change (scripts/shared-ui-bump.sh has the rules). shared-ui's release workflow
# triggers this; run it by hand to retry or to catch up on a release.
#
# Uses the JellyRock GitHub App rather than GITHUB_TOKEN: pushes and PRs made with GITHUB_TOKEN
# don't trigger CI, so the bump PR would never get its required checks.

on:
  repository_dispatch:
    types: [shared-ui-release]
  workflow_dispatch:
    inputs:
      version:
        description: shared-ui release tag, e.g. v1.2.0
        required: true
        type: string

concurrency:
  group: shared-ui-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JellyRock app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jellyrock
          repositories: jellyrock.app,shared-ui

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Commit as the JellyRock app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      - name: Bump shared-ui and open the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: scripts/shared-ui-bump.sh "$VERSION"
