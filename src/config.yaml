site:
  name: JellyRock
  site: 'https://jellyrock.app'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: JellyRock
    template: '%s — JellyRock'
  description: 'A free, open source Jellyfin client for Roku devices. Stream your movies, shows, music, and more.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: JellyRock
    type: website

i18n:
  language: en
  textDirection: ltr

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'dark:only' # JellyRock is a dark-themed app
